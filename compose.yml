services:
  frontend:
    profiles: ["prod", "frontend"]
    image: adoptme-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    networks:
      - adoptme-network

  frontend-dev:
    profiles: ["dev", "dev-frontend"]
    image: adoptme-frontend:dev
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=1000
      - FAST_REFRESH=true
    ports:
      - "3000:3000"
    networks:
      - adoptme-network
    stdin_open: true
    tty: true

  backend:
    profiles: ["prod", "backend"]
    image: adoptme-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      PORT: 5000
      OAUTH_REDIRECT_URI: ${OAUTH_REDIRECT_URI}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      PASSWORD_ENDEC_SALT: ${PASSWORD_ENDEC_SALT}
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - adoptme-network

  backend-test:
    profiles: ["test", "test-backend"]
    image: adoptme-backend:test
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: test
    environment:
      PORT: 5000
      OAUTH_REDIRECT_URI: 'http://backend-test:5000/api/oauth/google/callback'
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      PASSWORD_ENDEC_SALT: ${PASSWORD_ENDEC_SALT}
      NODE_ENV: test
    depends_on:
      db:
        condition: service_healthy
    networks:
      - adoptme-network

  backend-dev:
    profiles: ["dev", "dev-backend"]
    image: adoptme-backend:dev
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    environment:
      PORT: 5000
      OAUTH_REDIRECT_URI: 'http://backend-dev:5000/api/oauth/google/callback'
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      DB_HOST: db-dev
      DB_PORT: 5432
      DB_NAME: dev
      DB_USER: dev
      DB_PASSWORD: aa1234
      JWT_SECRET: secret123
      JWT_EXPIRATION: 1h
      PASSWORD_ENDEC_SALT: saltSALT
    volumes:
      - ./backend/src:/app/src
    ports:
      - "5000:5000"
    depends_on:
      - db-dev
    networks:
      - adoptme-network

  db:
    image: postgres:18-alpine
    profiles: ["prod", "test", "backend"]
    volumes:
      - adoptme_db:/var/lib/postgresql
      - ./init-scripts/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-postgres}"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - adoptme-network

  db-dev:
    image: postgres:18-alpine
    profiles: ["dev", "dev-backend"]
    volumes:
      - adoptme_dev_db:/var/lib/postgresql
      - ./init-scripts/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    environment:
      POSTGRES_DB: dev
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: aa1234
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-postgres}"]
      interval: 3s
      timeout: 3s
      retries: 5
    ports:
      - "5432:5432"
    networks:
      - adoptme-network

volumes:
  adoptme_db:
  adoptme_dev_db:

networks:
  adoptme-network:
    driver: bridge

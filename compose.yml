services:
  # ==========================================
  # Frontend (Vite / React)
  # ==========================================
  frontend:
    profiles: ["prod", "frontend"]
    image: adoptme-frontend:latest
    restart: unless-stopped
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    networks:
      - adoptme-network

  frontend-dev:
    profiles: ["dev", "dev-frontend"]
    image: adoptme-frontend:dev
    restart: on-failure
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    ports:
      - "3000:3000"
    networks:
      - adoptme-network
    stdin_open: true
    tty: true

  # ==========================================
  # Backend (Node.js / Express API)
  # ==========================================
  backend:
    profiles: ["prod", "backend"]
    image: adoptme-backend:latest
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-dev}
      DB_USER: ${POSTGRES_USER:-dev}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-aa1234}
      JWT_SECRET: ${JWT_SECRET:-secret123}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-24h}
      PASSWORD_ENDEC_SALT: ${PASSWORD_ENDEC_SALT:-saltSALT}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-qlqboj8f}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-241973542599985}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-1yZF5hG-S67k0LxDU2SoQ3qY77g}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-203986590761-bt65fd5hgkvpdc5um9haj5m58nncf45v.apps.googleusercontent.com}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-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}
      OAUTH_REDIRECT_URI: ${OAUTH_REDIRECT_URI:-http://localhost:5000/api/v1/auth/google/callback}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - adoptme-network

  backend-dev:
    profiles: ["dev", "dev-backend"]
    image: adoptme-backend:dev
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    environment:
      PORT: 5000
      NODE_ENV: development
      DB_HOST: db-dev
      DB_PORT: 5432
      DB_NAME: dev
      DB_USER: dev
      DB_PASSWORD: aa1234
      JWT_SECRET: secret123
      JWT_EXPIRATION: 24h
      PASSWORD_ENDEC_SALT: saltSALT
      CLOUDINARY_CLOUD_NAME: qlqboj8f
      CLOUDINARY_API_KEY: 241973542599985
      CLOUDINARY_API_SECRET: 1yZF5hG-S67k0LxDU2SoQ3qY77g
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-203986590761-bt65fd5hgkvpdc5um9haj5m58nncf45v.apps.googleusercontent.com}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-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}
      OAUTH_REDIRECT_URI: ${OAUTH_REDIRECT_URI:-http://localhost:5000/api/v1/auth/google/callback}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    volumes:
      - ./backend/src:/app/src
    ports:
      - "5000:5000"
    depends_on:
      db-dev:
        condition: service_healthy
    networks:
      - adoptme-network

  # ==========================================
  # Database (PostgreSQL)
  # ==========================================
  db:
    image: postgres:18-alpine
    profiles: ["prod", "backend"]
    restart: unless-stopped
    volumes:
      - adoptme_db:/var/lib/postgresql
      - ./init-scripts/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dev}
      POSTGRES_USER: ${POSTGRES_USER:-dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aa1234}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-dev} -d $${POSTGRES_DB:-dev}"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - adoptme-network

  db-dev:
    image: postgres:18-alpine
    profiles: ["dev", "dev-backend"]
    restart: on-failure
    volumes:
      - adoptme_dev_db:/var/lib/postgresql
      - ./init-scripts/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    environment:
      POSTGRES_DB: dev
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: aa1234
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-dev} -d $${POSTGRES_DB:-dev}"]
      interval: 3s
      timeout: 3s
      retries: 5
    ports:
      - "5432:5432"
    networks:
      - adoptme-network

volumes:
  adoptme_db:
  adoptme_dev_db:

networks:
  adoptme-network:
    driver: bridge
